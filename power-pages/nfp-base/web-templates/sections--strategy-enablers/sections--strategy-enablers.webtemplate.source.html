{% assign strategyId = slot.hit_strategycycle.id %}

{% fetchxml enablers %}
<fetch>
  <entity name="hit_strategyenabler">
    <attribute name="hit_name" />
    <attribute name="hit_sortorder" />
    <filter>
      <condition attribute="hit_strategycycle"
                 operator="eq"
                 value="{{ strategyId }}" />
    </filter>
    <order attribute="hit_sortorder" />
  </entity>
</fetch>
{% endfetchxml %}

{% assign items = enablers.results.entities %}

<section class="strategy-enablers">
  <h3>Enablers</h3>
  <ul>
    {% for e in items %}
      <li>{{ e.hit_name }}</li>
    {% endfor %}
  </ul>
</section>
