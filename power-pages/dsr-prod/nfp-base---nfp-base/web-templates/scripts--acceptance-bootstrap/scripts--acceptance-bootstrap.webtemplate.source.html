<script>
  console.log("✅ scripts--acceptance-bootstrap LOADED");
</script>

<script>
(async function () {
  console.log("✅ Acceptance bootstrap diagnostic loaded");

  async function getCsrfToken() {
    const res = await fetch("/_layout/tokenhtml", { credentials: "same-origin" });
    const text = await res.text();
    const doc = new DOMParser().parseFromString(text, "text/html");
    const input = doc.querySelector("input[name='__RequestVerificationToken']");
    return input && input.value;
  }

  try {
    const token = await getCsrfToken();
    console.log("✅ CSRF token retrieved", token ? "OK" : "MISSING");

    const payload = {
      hit_acceptancestatus: 0
    };

    console.log("➡️ Attempting test POST to hit_offeringacceptances");

    const res = await fetch("/_api/hit_offeringacceptances", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json",
        "__RequestVerificationToken": token,
        "OData-MaxVersion": "4.0",
        "OData-Version": "4.0"
      },
      body: JSON.stringify(payload)
    });

    console.log("⬅️ POST response status:", res.status);

    const txt = await res.text();
    console.log("⬅️ Response body:", txt);

  } catch (err) {
    console.error("❌ Diagnostic failed", err);
  }
})();
</script>
