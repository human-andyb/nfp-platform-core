 {% comment %}
Persona Dropdown Component
- Source: Dataverse table hit_persona
- Label field: hit_descriptivename
- Outputs: <select> with pill styling
- Assumes table permissions allow read access to hit_persona for the current user/anonymous as required
{% endcomment %}

{% fetchxml personas %}
<fetch version="1.0" mapping="logical" distinct="true">
  <entity name="hit_persona">
    <attribute name="hit_personaid" />
    <attribute name="hit_descriptivename" />
    <order attribute="hit_descriptivename" descending="false" />
  </entity>
</fetch>
{% endfetchxml %}

<div class="hit-persona-select">
  <label class="hit-persona-select__label" for="hitPersonaSelect">I AM</label>

  <div class="hit-persona-select__control">
    <select id="hitPersonaSelect" name="hitPersonaSelect" class="hit-persona-select__select" aria-label="Select persona">
      <option value="" selected disabled>Select…</option>

      {% for p in personas.results.entities %}
        <option value="{{ p.hit_personaid }}">
          {{ p.hit_descriptivename | escape }}
        </option>
      {% endfor %}
    </select>

    <span class="hit-persona-select__chevron" aria-hidden="true"></span>
  </div>
</div>
